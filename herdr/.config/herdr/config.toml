onboarding = false

[theme]
name = "catppuccin"
auto_switch = false

[ui]
pane_gaps = false
hide_tab_bar_when_single_tab = true
tab_bar_position = "bottom"
copy_on_select = false
# Sidebar oculta al iniciar; se abre/cierra con prefix+b
sidebar_start_collapsed = true
sidebar_width = 20
window_title = "{workspace}: {terminal_title}"

# En la sidebar, mostrar el resumen de la sesión de Claude (título del terminal)
[ui.sidebar.agents.rows_by_agent]
claude = [["state_icon", "machine", "workspace", "tab"], ["terminal_title_stripped"]]

[ui.sound.agents]
claude = "off"

[terminal]
# Paneles nuevos se abren en la carpeta del panel actual
new_cwd = "follow"

# Basado en la config de craftzdog, adaptado a WSL + WezTerm:
# sin atajos ctrl+shift (WezTerm los captura antes que herdr)
[keys]
prefix = "ctrl+b"

reload_config = "prefix+r"
resize_mode = "prefix+shift+r"

detach = "prefix+d"
rename_tab = "prefix+comma"
close_tab = "prefix+&"
copy_mode = "prefix+["
last_pane = "prefix+;"

# Moverse entre paneles (como Vim)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Splits (igual que tmux)
split_vertical = ["prefix+v", "prefix+|", "prefix+%", "prefix+backslash"]
split_horizontal = ["prefix+minus", 'prefix+"', "prefix+_"]

goto = "prefix+u"
open_notification_target = "prefix+shift+o"

# Abrir la carpeta actual en el Explorador de Windows
[[keys.command]]
key = "prefix+o"
type = "shell"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && explorer.exe . || true'

# Cerrar todos los demás paneles de la pestaña actual (requiere jq)
[[keys.command]]
key = "prefix+e"
type = "shell"
command = '''herdr pane list | jq -r --arg t "$HERDR_ACTIVE_TAB_ID" --arg p "$HERDR_ACTIVE_PANE_ID" '.result.panes[] | select(.tab_id == $t and .pane_id != $p) | .pane_id' | xargs -r -n1 herdr pane close'''

# Lazygit en un panel nuevo, en la carpeta actual
[[keys.command]]
key = "prefix+g"
type = "pane"
command = 'cd "$HERDR_ACTIVE_PANE_CWD" && lazygit'

# Redimensionar el panel actual
[[keys.command]]
key = "prefix+shift+h"
type = "shell"
command = 'herdr pane resize --direction left --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+j"
type = "shell"
command = 'herdr pane resize --direction down --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+k"
type = "shell"
command = 'herdr pane resize --direction up --pane "$HERDR_ACTIVE_PANE_ID"'

[[keys.command]]
key = "prefix+shift+l"
type = "shell"
command = 'herdr pane resize --direction right --pane "$HERDR_ACTIVE_PANE_ID"'

[experimental]
pane_history = true
